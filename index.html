<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Style</title>
    <style>
        h1 {
            color: #2b579a;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        p {
            font-size: 18px;
            text-transform: capitalize;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <h1>Font and Text Style Demo</h1>
    <p>yahan aap apne font aur text styles test kar sakte ho.</p>
</body>
</html>
